name: Build and deploy al-folio site

on:
  push:
    branches:
      - al-folio-rebuild
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true

      - name: Build Jekyll site
        run: |
          export JEKYLL_ENV=production
          bundle exec jekyll build
          touch _site/.nojekyll

      - name: Publish generated site to main
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: main
          folder: _site
          clean: true
